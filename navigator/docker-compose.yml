version: "3.9"

services:
  navigator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cft-navigator
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      # Overrides the help service URL in the browser.
      # Must be accessible FROM THE BROWSER (not inside Docker network).
      # Default: http://localhost:8085 (chm-viewer-service on host)
      - HELP_SERVICE_URL=http://localhost:8085
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
