server.port=8085
spring.application.name=chm-viewer-service

# ── CHM settings ──────────────────────────────────────────────────────────────
# Directory where .chm files are placed (mounted volume in Docker)
chm.files-dir=./chm-files

# Directory where extracted HTML is cached
chm.converted-dir=./converted

# Path to 7-Zip executable
# Windows: C:/Program Files/7-Zip/7z.exe
# Linux/Docker: 7z
chm.seven-zip-path=7z

# ── Multipart upload ──────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

# ── CORS ──────────────────────────────────────────────────────────────────────
chm.cors-origins=*

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.chmviewer=INFO
