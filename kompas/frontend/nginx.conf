server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # SPA: любой маршрут отдаёт index.html.
    # Сам index.html не кэшируем — иначе после пересборки браузер продолжит
    # тянуть старые имена бандлов. Бандлы с хешем в имени кэшируются безопасно.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API проксируем на бэкенд — так SPA и API живут на одном origin, CORS не нужен
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
}
