server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь отдаём на index.html (роутинг Angular — на клиенте)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статику кэшируем, index.html — нет (чтобы после пересборки не залипал)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
