# Демонстрационные справочники «Компаса» (раздел 13 ТЗ: данные синтетические).
# Роли, компетенции и активности вымышлены «по мотивам» реальных.

positions:
  - title: "Разработчик Java"
    type: CURRENT
    careerTrack: "Разработка ПО"
    jobDescriptionRef: >-
      Разрабатывает и сопровождает компоненты прикладных банковских систем на Java.
      Работает в рамках поставленных задач спринта, пишет unit-тесты, участвует в код-ревью
      как автор. Взаимодействует с системным аналитиком по уточнению требований.

  - title: "Ведущий разработчик Java"
    type: TARGET
    careerTrack: "Разработка ПО"
    jobDescriptionRef: >-
      Отвечает за техническое решение в рамках функциональной подсистемы: проектирует
      компоненты и контракты API, принимает решения по модели данных, следит за
      производительностью и надёжностью. Проводит код-ревью, развивает младших
      разработчиков, участвует в оценке задач и в диалоге с заказчиком и аналитиками.
      Отвечает за сопровождение решения в промышленной эксплуатации.

  - title: "Архитектор решений"
    type: TARGET
    careerTrack: "Разработка ПО"
    jobDescriptionRef: >-
      Проектирует архитектуру прикладных решений уровня продукта, выбирает
      интеграционные шаблоны, формализует нефункциональные требования, обосновывает
      технологический выбор перед заказчиком и техническим комитетом, управляет
      техническим долгом и архитектурными рисками.

  - title: "Системный аналитик"
    type: CURRENT
    careerTrack: "Системный анализ"
    jobDescriptionRef: >-
      Собирает и формализует требования к прикладным банковским подсистемам,
      описывает пользовательские сценарии, согласует постановки с разработкой,
      сопровождает задачи до приёмки.

  - title: "Ведущий системный аналитик"
    type: TARGET
    careerTrack: "Системный анализ"
    jobDescriptionRef: >-
      Отвечает за требования к функциональному направлению целиком: выявляет
      потребности заказчика, моделирует процессы, проектирует контракты интеграций,
      управляет изменениями требований, фасилитирует обсуждения с бизнесом и
      разработкой, развивает младших аналитиков.

competencies:
  # --- Ведущий разработчик Java ---
  - code: "LJD-01"
    name: "Проектирование компонентов и API"
    role: "Ведущий разработчик Java"
    targetLevel: 3
    description: >-
      Самостоятельно проектирует структуру компонента и контракты его API, разделяет
      слои ответственности, обосновывает решение перед командой и учитывает обратную
      совместимость при изменениях.

  - code: "LJD-02"
    name: "Java-платформа и производительность"
    role: "Ведущий разработчик Java"
    targetLevel: 3
    description: >-
      Понимает работу JVM, модель памяти и многопоточность; умеет профилировать
      приложение, находить узкие места и устранять деградации под нагрузкой.

  - code: "LJD-03"
    name: "Проектирование данных и SQL"
    role: "Ведущий разработчик Java"
    targetLevel: 3
    description: >-
      Проектирует схему данных под задачу, выбирает индексы, анализирует планы запросов,
      понимает уровни изоляции транзакций и их влияние на согласованность.

  - code: "LJD-04"
    name: "Качество и тестирование"
    role: "Ведущий разработчик Java"
    targetLevel: 3
    description: >-
      Выстраивает пирамиду тестов для подсистемы, вводит интеграционные и контрактные
      тесты, добивается воспроизводимости сборки и отвечает за качество релиза.

  - code: "LJD-05"
    name: "Код-ревью и наставничество"
    role: "Ведущий разработчик Java"
    targetLevel: 3
    description: >-
      Проводит содержательное код-ревью, формулирует замечания развивающе, ведёт
      младших разработчиков, передаёт стандарты и практики команды.

  - code: "LJD-06"
    name: "Надёжность и промышленная эксплуатация"
    role: "Ведущий разработчик Java"
    targetLevel: 2
    description: >-
      Закладывает наблюдаемость (логи, метрики, трассировка), участвует в разборе
      инцидентов, проектирует поведение системы при отказах внешних сервисов.

  - code: "LJD-07"
    name: "Коммуникация с заказчиком и аналитиками"
    role: "Ведущий разработчик Java"
    targetLevel: 2
    description: >-
      Переводит бизнес-постановку в техническую, задаёт уточняющие вопросы,
      аргументирует сроки и ограничения, ведёт переговоры об объёме задачи.

  # --- Архитектор решений ---
  - code: "ARC-01"
    name: "Архитектура прикладных решений"
    role: "Архитектор решений"
    targetLevel: 4
    description: >-
      Проектирует архитектуру продукта целиком, декомпозирует на подсистемы,
      фиксирует архитектурные решения и их обоснование.

  - code: "ARC-02"
    name: "Интеграционные шаблоны"
    role: "Архитектор решений"
    targetLevel: 3
    description: >-
      Осознанно выбирает между синхронной и асинхронной интеграцией, применяет
      очереди, идемпотентность, паттерны согласованности в распределённых системах.

  - code: "ARC-03"
    name: "Нефункциональные требования"
    role: "Архитектор решений"
    targetLevel: 3
    description: >-
      Формализует требования к производительности, доступности и безопасности,
      проверяет решение нагрузочным тестированием.

  - code: "ARC-04"
    name: "Технологический выбор и обоснование"
    role: "Архитектор решений"
    targetLevel: 3
    description: >-
      Сравнивает альтернативы по явным критериям, оформляет ADR, защищает выбор
      перед техническим комитетом.

  - code: "ARC-05"
    name: "Управление техническим долгом"
    role: "Архитектор решений"
    targetLevel: 3
    description: >-
      Ведёт реестр технического долга, оценивает риски и договаривается о включении
      работ по долгу в план релизов.

  - code: "ARC-06"
    name: "Влияние и переговоры"
    role: "Архитектор решений"
    targetLevel: 3
    description: >-
      Доносит техническую позицию до бизнеса на понятном языке, выстраивает
      договорённости между командами.

  # --- Ведущий системный аналитик ---
  - code: "LSA-01"
    name: "Выявление и формализация требований"
    role: "Ведущий системный аналитик"
    targetLevel: 4
    description: >-
      Выявляет реальную потребность за озвученным запросом, формализует требования
      так, что они однозначно читаются разработкой и тестированием.

  - code: "LSA-02"
    name: "Моделирование бизнес-процессов"
    role: "Ведущий системный аналитик"
    targetLevel: 3
    description: >-
      Строит модели процессов в BPMN, выделяет сценарии и исключения, согласует
      модель с бизнес-заказчиком.

  - code: "LSA-03"
    name: "Проектирование интеграций и API-контрактов"
    role: "Ведущий системный аналитик"
    targetLevel: 3
    description: >-
      Описывает контракты взаимодействия систем, форматы сообщений, сценарии ошибок
      и повторной обработки.

  - code: "LSA-04"
    name: "Банковская предметная область"
    role: "Ведущий системный аналитик"
    targetLevel: 3
    description: >-
      Свободно оперирует понятиями расчётно-кассового обслуживания, платежей и
      бухгалтерского учёта в банке, понимает требования регулятора.

  - code: "LSA-05"
    name: "Управление изменениями требований"
    role: "Ведущий системный аналитик"
    targetLevel: 3
    description: >-
      Оценивает влияние изменения на смежные подсистемы, ведёт версионность
      постановок, согласует изменение объёма.

  - code: "LSA-06"
    name: "Фасилитация и презентация"
    role: "Ведущий системный аналитик"
    targetLevel: 3
    description: >-
      Ведёт рабочие встречи с разнородными участниками, доводит обсуждение до
      решения, публично представляет результат.

activities:
  - code: "ACT-001"
    title: "Внутренний курс «Проектирование модульных приложений на Java»"
    type: COURSE
    sourceRef: "Учебный центр ЦФТ"
    competencies: ["LJD-01", "ARC-01"]
    description: >-
      Пять занятий по декомпозиции приложения, границам модулей и проектированию
      контрактов. Завершается защитой учебного проекта.

  - code: "ACT-002"
    title: "Практика: спроектировать API новой подсистемы и защитить на ревью"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["LJD-01", "LJD-07"]
    description: >-
      Взять ближайшую задачу с новым внешним контрактом, подготовить проект API,
      вынести на техническое ревью и доработать по замечаниям.

  - code: "ACT-003"
    title: "Книга: Р. Мартин, «Чистая архитектура»"
    type: BOOK
    sourceRef: "Библиотека Locus"
    competencies: ["LJD-01", "ARC-01"]
    description: >-
      Разбор принципов разделения ответственности и границ. Рекомендуется вести
      конспект с примерами из своей подсистемы.

  - code: "ACT-004"
    title: "Воркшоп «Профилирование и настройка JVM»"
    type: COURSE
    sourceRef: "Учебный центр ЦФТ"
    competencies: ["LJD-02"]
    description: >-
      Практикум по async-profiler и анализу GC-логов на подготовленных стендах
      с воспроизведением деградаций.

  - code: "ACT-005"
    title: "Практика: расследовать деградацию производительности на стенде"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["LJD-02", "LJD-06"]
    description: >-
      Взять реальный инцидент по времени отклика, собрать профиль, сформулировать
      гипотезу, подтвердить её замером и выпустить исправление.

  - code: "ACT-006"
    title: "Курс «Планы запросов и индексы в PostgreSQL»"
    type: COURSE
    sourceRef: "Учебный центр ЦФТ"
    competencies: ["LJD-03"]
    description: >-
      Чтение EXPLAIN ANALYZE, выбор индексов, типовые ошибки проектирования схемы
      под банковские объёмы данных.

  - code: "ACT-007"
    title: "Практика: оптимизировать десять самых тяжёлых запросов подсистемы"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["LJD-03", "LJD-02"]
    description: >-
      Снять топ запросов по времени, оптимизировать, зафиксировать результат
      до и после в отчёте для команды.

  - code: "ACT-008"
    title: "Курс «Тестирование: от unit до контрактных тестов»"
    type: COURSE
    sourceRef: "Учебный центр ЦФТ"
    competencies: ["LJD-04"]
    description: >-
      Пирамида тестов, Testcontainers, контрактное тестирование интеграций,
      критерии готовности релиза.

  - code: "ACT-009"
    title: "Практика: поднять покрытие подсистемы интеграционными тестами"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["LJD-04"]
    description: >-
      Выбрать критичный сценарий без автотестов, покрыть его интеграционным тестом
      и включить в регламент сборки.

  - code: "ACT-010"
    title: "Наставничество: вести младшего разработчика в течение квартала"
    type: MENTORING
    sourceRef: "Программа наставничества ЦФТ"
    competencies: ["LJD-05", "ARC-06"]
    description: >-
      Еженедельные встречи один на один, разбор задач и код-ревью, постановка
      целей и обратная связь по итогам квартала.

  - code: "ACT-011"
    title: "Практика: стать постоянным ревьюером в двух командных репозиториях"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["LJD-05"]
    description: >-
      Взять на себя регулярное ревью, выработать чек-лист и договориться с командой
      о едином стандарте замечаний.

  - code: "ACT-012"
    title: "Курс «Наблюдаемость: логи, метрики, трассировка»"
    type: COURSE
    sourceRef: "Учебный центр ЦФТ"
    competencies: ["LJD-06", "ARC-03"]
    description: >-
      Инструментирование приложения, построение дашбордов, разбор инцидентов
      по сигналам мониторинга.

  - code: "ACT-013"
    title: "Практика: дежурство по подсистеме и разбор инцидентов"
    type: PRACTICE
    sourceRef: "Регламент сопровождения"
    competencies: ["LJD-06"]
    description: >-
      Войти в график дежурств, провести не менее двух постмортемов и внести
      исправления по их итогам.

  - code: "ACT-014"
    title: "Практика: вести диалог с заказчиком по своей задаче без посредника"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["LJD-07", "LSA-06"]
    description: >-
      Самостоятельно провести уточняющую встречу с бизнес-заказчиком, зафиксировать
      договорённости и согласовать объём.

  - code: "ACT-015"
    title: "Курс «Архитектура распределённых систем»"
    type: COURSE
    sourceRef: "Учебный центр ЦФТ"
    competencies: ["ARC-01", "ARC-02"]
    description: >-
      Интеграционные шаблоны, согласованность, идемпотентность, компромиссы
      доступности и целостности.

  - code: "ACT-016"
    title: "Практика: оформить три ADR по решениям своей подсистемы"
    type: PRACTICE
    sourceRef: "Реестр архитектурных решений"
    competencies: ["ARC-04", "ARC-01"]
    description: >-
      Описать контекст, альтернативы и критерии выбора, вынести на обсуждение
      технического комитета.

  - code: "ACT-017"
    title: "Практика: нагрузочное тестирование релиза и формализация НФТ"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["ARC-03", "LJD-02"]
    description: >-
      Сформулировать целевые показатели отклика и доступности, проверить их
      нагрузочным тестом, зафиксировать в требованиях.

  - code: "ACT-018"
    title: "Практика: вести реестр технического долга направления"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["ARC-05"]
    description: >-
      Собрать и приоритизировать технический долг, договориться о квоте в плане
      релизов, отчитаться о динамике за квартал.

  - code: "ACT-019"
    title: "Курс «Выявление требований: интервью и анализ потребностей»"
    type: COURSE
    sourceRef: "Учебный центр ЦФТ"
    competencies: ["LSA-01", "LSA-06"]
    description: >-
      Техники интервью, работа с противоречивыми требованиями, отделение
      потребности от предложенного решения.

  - code: "ACT-020"
    title: "Курс «BPMN для банковских процессов»"
    type: COURSE
    sourceRef: "Учебный центр ЦФТ"
    competencies: ["LSA-02", "LSA-04"]
    description: >-
      Нотация BPMN на примерах расчётно-кассового обслуживания и платежей,
      типовые ошибки моделирования.

  - code: "ACT-021"
    title: "Практика: описать контракт интеграции со смежной системой"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["LSA-03", "ARC-02"]
    description: >-
      Согласовать с обеими командами формат сообщений, сценарии ошибок и повторов,
      зафиксировать версионирование контракта.

  - code: "ACT-022"
    title: "Сообщество: выступить на внутреннем митапе направления"
    type: COMMUNITY
    sourceRef: "Портал Locus"
    competencies: ["LSA-06", "ARC-06", "LJD-05"]
    description: >-
      Подготовить доклад по своему решению или разбору инцидента и выступить
      на внутренней встрече направления.

  - code: "ACT-023"
    title: "Проект: роль технического лидера в кросс-командном релизе"
    type: PROJECT
    sourceRef: "Портфель проектов подразделения"
    competencies: ["ARC-06", "LJD-01", "LSA-05"]
    description: >-
      Провести задачу, затрагивающую несколько команд, от постановки до вывода
      в эксплуатацию, отвечая за техническое решение и согласования.

  - code: "ACT-024"
    title: "Практика: разбор изменений требований и оценка влияния"
    type: PRACTICE
    sourceRef: "Рабочие задачи команды"
    competencies: ["LSA-05", "LSA-01"]
    description: >-
      Для трёх входящих изменений подготовить оценку влияния на смежные подсистемы
      и согласовать пересмотр объёма работ.

# Справочник колонки «Цели по развитию» формы «ПЛАН РАЗВИТИЯ».
# Список принадлежит старому сервису: это значения его выпадающего списка,
# и «Компас» обязан выбирать строго из них, иначе перенос в форму не встанет.
goalCategories:
  - "Цели развития не определены/Развитие не требуется"
  - "Адаптация к должности"
  - "Повышение объемов производства"
  - "Увеличение скорости выполнения задач"
  - "Увеличение качества выполняемых задач"
  - "Развитие личностных компетенций"
  - "Развитие управленческих компетенций"
  - "Кадровый резерв на должность/роль"
  - "Адаптация к процессам"
  - "Изучение продуктов"
  - "Изучение инструментария и технологий"
