    jobDescriptionRef: "Профиль должности «Менеджер проектов» (семейство «Менеджер проектов», грейд 1 из 4). Требуемый опыт: Опыт работы от 1 года менеджером, администратором проекта, лидером команды или в аналогичной должности с опытом управления командой Ключевые функции: Управление проектом или отдельными задачами самостоятельно или с привлечением руководителя и/или менеджера проектов более высокой квалификации; Сбор информации об окружении, предмете, заинтересованных лицах по задачам или проекту. Формирование целей и задач проекта, согласование рамок проекта, его этапов, сроков и ключевых характеристик самостоятельно или с привлечением руководителя и/или менеджера проектов более высокой квалификации; Осуществление планирования в рамках проекта, формирование плана проекта по срокам и трудозатратам, декомпозиция задач, распределение работы по направлениям между смежными подразделениями Компании, завершение проектов самостоятельно или с привлечением руководителя и/или менеджера проектов более высокой квалификации; Обеспечение среды, необходимой для реализации задач проекта (оборудование, материалы, коммуникации, информационные ресурсы и пр.) самостоятельно или с привлечением руководителя и/или ответственных сотрудников; Организация мероприятий по сдаче работы Заказчику в согласованном формате (например, демонстрация, приемо-сдаточные испытания), получение обратной связи от Заказчика самостоятельно или с привлечением руководителя и/или менеджера проектов более высокой квалификации; Предоставление обратной связи по результатам и по ходу реализации отдельных задач или проектов команде, руководству, Заказчику; Работа с проектной командой: постановка цели, продажа идеи, распределение и координация работ, проведение регулярных встреч (планерки, скрамы, митинги), актуализация и приоритизация бэклога Требуемые знания: Знание продуктов подразделения; Знание законодательства и стандартных бизнес-процессов в предметной области продуктов подразделения; Знание жизненного цикла разработки программного обеспечения; Знание правил ведения деловой переписки, ведения переговоров. Знание принципов организации совещаний и встреч (формирование повестки, модерирование, протоколирование); Знание организационной структуры Компании, сфер ответственности подразделений, стандартов Компании; Знание систем учета Компании/подразделения (в рамках своих должностных обязанностей); Знание основных терминов и сокращений, используемых в документации и принятых в подразделении Специальные навыки: Навыки в области делового общения, ведения деловой переписки, деловых переговоров, организации совещаний и встреч (формирование повестки, модерирование, протоколирование); Навыки планирования, формирования плана проекта, контроля исполнения задач; Навыки использования офисных и общесистемных программных средств"
