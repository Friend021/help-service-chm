циями системы, прием обращений, уточнение запросов пользователей, формирование рекомендаций по применению функций системы; Обработка и изучение запросов на изменение функций системы, предложение вариантов реализации запроса, уточнение вариантов реализации изменений с командой, оценка влияния возможных изменений на качество системы и интересы пользователей, выбор наиболее эффективного варианта реализации запроса совместно с инженером-технологом более высокой квалификации, передача проанализированных запросов коллегам для планирования их реализации Требуемые знания: Знание продуктов подразделения/команды и смежных продуктов; Знание основ законодательства, стандартных бизнес-процессов в предметной области подразделения, используемых в продуктах подразделения; Знание основ стандартов создания пользовательских интерфейсов; Знание основных терминов и сокращений, используемых в документации и принятых в подразделении Специальные навыки: Навыки применения методик системного анализа, разработки требований к системе (интервью, мозговой штурм, фотография рабочего дня, метод номинальных групп, составление интеллект-карт, диаграмма сходства, анализ нормативной документации, анализ моделей деятельности и др.), моделирования бизнес-процессов (метод функционального моделирования, метод моделирования процессов и др.); Навыки обработки требований и приведения их к заданной степени качества (стандартные критерии качества требований - полнота, корректность, недвусмысленность, упорядоченность по важности и стабильности, проверяемость, модифицируемость, трассируемость, понимаемость); Навыки работы с инструментарием, используемым в подразделении; Навыки написания документации, включая пользовательскую документацию и бизнес-описание функционала; Навыки в области делового общения, ведения деловой переписки, ведения переговоров; Навыки использования офисных и общесистемных программных средств; Навык макетирования пользовательских интерфейсов; Навык анализа нормативной документации по предмет