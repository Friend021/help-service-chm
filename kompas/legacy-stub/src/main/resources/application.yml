server:
  port: 8081

spring:
  application:
    name: legacy-stub
  config:
    import: classpath:demo-employees.yml
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        cachecontrol:
          # Без этого браузер кэширует css по эвристике и после правки стилей
          # показывает старую страницу — на демо это выглядит как поломка вёрстки
          no-cache: true

legacy:
  # HMAC-секрет, общий с «Компасом» (см. /docs/integration.md)
  jwt-secret: ${LEGACY_JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
  # TTL токена входа
  jwt-ttl: PT10M
  kompas-frontend-url: ${LEGACY_KOMPAS_FRONTEND_URL:http://localhost:4200}
  # Значения выпадающего списка «Инструмент развития (как развиваем)».
  instruments:
    - "Развитие на рабочем месте"
    - "Развитие через других"
    - "Развитие через учебные программы"
  # Значения выпадающего списка «Цели по развитию» — справочник этого сервиса.
  # «Компас» выбирает категорию строго из него (см. /docs/integration.md).
  goal-categories:
    - "Цели развития не определены/Развитие не требуется"
    - "Адаптация к должности"
    - "Повышение объемов производства"
    - "Увеличение скорости выполнения задач"
    - "Увеличение качества выполняемых задач"
    - "Развитие личностных компетенций"
    - "Развитие управленческих компетенций"
    - "Кадровый резерв на должность/роль"
    - "Адаптация к процессам"
    - "Изучение продуктов"
    - "Изучение инструментария и технологий"

logging:
  level:
    ru.cft.legacy: INFO
