server:
  port: 8081
  # Хэндовер-токен из «Компаса» прилетает в URL (/import?token=<длинный JWT>),
  # а поверх браузер подклеивает куки Keycloak/сессии. Суммарно строка запроса
  # + заголовки перелезают дефолтные 8 КБ Tomcat → «Request header is too large»
  # и переход на :8081 падает ещё до контроллера. Поднимаем лимит.
  max-http-request-header-size: 64KB

spring:
  application:
    name: legacy-stub
  config:
    import: classpath:demo-employees.yml
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:compass-frontend}
            # Публичный клиент (PKCE), без секрета — как и фронт Компаса.
            client-authentication-method: none
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            provider: keycloak
        provider:
          keycloak:
            # Явные эндпоинты вместо issuer-uri — Spring НЕ делает OIDC discovery.
            # Браузерный authorization-uri уходит в редирект входа (localhost:3000),
            # backchannel (token/jwks/userinfo) по умолчанию тоже localhost (локальный запуск),
            # а в docker переопределяется на http://auth-mock:3000 (см. docker-compose.yml).
            authorization-uri: ${OIDC_AUTH_URI:http://localhost:3000/realms/compass/protocol/openid-connect/auth}
            token-uri: ${OIDC_TOKEN_URI:http://localhost:3000/realms/compass/protocol/openid-connect/token}
            jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:3000/realms/compass/protocol/openid-connect/certs}
            user-info-uri: ${OIDC_USERINFO_URI:http://localhost:3000/realms/compass/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        cachecontrol:
          # Без этого браузер кэширует css по эвристике и после правки стилей
          # показывает старую страницу — на демо это выглядит как поломка вёрстки
          no-cache: true
      chain:
        strategy:
          content:
            # В имя файла подмешивается хеш содержимого: /css/plan-<hash>.css.
            # После правки стилей меняется URL, и старый кэш физически не может
            # подмениться — заголовков для этого недостаточно.
            enabled: true
            paths: /**

legacy:
  # HMAC-секрет, общий с «Компасом» (см. /docs/integration.md)
  jwt-secret: ${LEGACY_JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
  # TTL токена входа
  jwt-ttl: PT10M
  kompas-frontend-url: ${LEGACY_KOMPAS_FRONTEND_URL:http://localhost:4200}
  # Значения выпадающего списка «Инструмент развития (как развиваем)».
  instruments:
    - "Развитие на рабочем месте"
    - "Развитие через других"
    - "Развитие через учебные программы"
  # Значения выпадающего списка «Цели по развитию» — справочник этого сервиса.
  # «Компас» выбирает категорию строго из него (см. /docs/integration.md).
  goal-categories:
    - "Цели развития не определены/Развитие не требуется"
    - "Адаптация к должности"
    - "Повышение объемов производства"
    - "Увеличение скорости выполнения задач"
    - "Увеличение качества выполняемых задач"
    - "Развитие личностных компетенций"
    - "Развитие управленческих компетенций"
    - "Кадровый резерв на должность/роль"
    - "Адаптация к процессам"
    - "Изучение продуктов"
    - "Изучение инструментария и технологий"

logging:
  level:
    ru.cft.legacy: INFO
