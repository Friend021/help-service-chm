services:
  postgres:
    image: postgres:16-alpine
    container_name: kompas-postgres
    environment:
      POSTGRES_DB: kompas
      POSTGRES_USER: kompas
      POSTGRES_PASSWORD: kompas
    ports:
      - "5433:5432"
    volumes:
      - kompas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kompas -d kompas"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    container_name: kompas-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kompas
      SPRING_DATASOURCE_USERNAME: kompas
      SPRING_DATASOURCE_PASSWORD: kompas
      KOMPAS_LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      KOMPAS_LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      KOMPAS_LLM_API_KEY: ${LLM_API_KEY:-}
      KOMPAS_LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      KOMPAS_LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      KOMPAS_SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KOMPAS_LEGACY_IMPORT_URL: ${LEGACY_IMPORT_URL:-http://localhost:8081/import}
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: kompas-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  legacy-stub:
    build:
      context: ./legacy-stub
    container_name: kompas-legacy-stub
    environment:
      LEGACY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LEGACY_KOMPAS_FRONTEND_URL: ${KOMPAS_FRONTEND_URL:-http://localhost:4200}
    ports:
      - "8081:8081"

volumes:
  kompas-pgdata:
